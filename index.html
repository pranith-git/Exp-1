<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration in Html Scriptf branch
</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="event-info">
            <span class="badge">🎉 EVENT 2026</span>
            <h1>Future Tech<br><span>Whatever Event in the world</span></h1>
            <p>
                Join us for an exciting day of technology, innovation,
                networking and inspiring talks.
            </p>

            <div class="event-details">
                <div>📅 <strong>September 20, 2049</strong></div>
                <div>📍 <strong>California, India</strong></div>
                <div>⏰ <strong>9:00 AM – 5:00 PM</strong></div>
            </div>
        </div>

        <div class="registration-card">
            <h2>Create Your Account</h2>
            <p class="subtitle">Register now to reserve your event seat.</p>

            <form id="registrationForm">

                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="ticket">Ticket Type</label>
                    <select id="ticket" required>
                        <option value="">Select a ticket</option>
                        <option value="standard">Standard - ₹499</option>
                        <option value="premium">Premium - ₹999</option>
                        <option value="vip">VIP - ₹1,999</option>
                    </select>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Create password"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">Confirm</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required
                        >
                    </div>
                </div>

                <label class="checkbox">
                    <input type="checkbox" id="terms" required>
                    <span>I agree to the event terms and conditions.</span>
                </label>

                <button type="submit">
                    Register for Event →
                </button>

                <p id="message"></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
